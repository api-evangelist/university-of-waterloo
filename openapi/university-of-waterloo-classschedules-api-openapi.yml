openapi: 3.2.0
info:
  title: Waterloo OpenData Class Schedules API
  version: v3
servers:
- url: https://openapi.data.uwaterloo.ca
  description: University of Waterloo OpenData API v3
security:
- apiKey: []
tags:
- name: ClassSchedules
paths:
  /v3/ClassSchedules/{termCode}:
    get:
      tags:
      - ClassSchedules
      summary: Get the Course IDs that have one or more active and associated schedules in the…
      parameters:
      - name: termCode
        in: path
        description: Waterloo Term code to filter on
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      operationId: getV3ClassSchedulesByTermCode
      x-operation-id-source: derived
  /v3/ClassSchedules/{termCode}/{courseId}:
    get:
      tags:
      - ClassSchedules
      summary: Get Class data for a scheduled Course by Course ID, in a specific Term
      parameters:
      - name: termCode
        in: path
        description: Waterloo Term code to filter on
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
      - name: courseId
        in: path
        description: Course ID to filter on
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'
      operationId: getV3ClassSchedulesByTermCodeByCourseId
      x-operation-id-source: derived
  /v3/ClassSchedules/{termCode}/{subject}/{catalogNumber}:
    get:
      tags:
      - ClassSchedules
      summary: Get Class data for a scheduled Course by Subject and catalog number, in a…
      parameters:
      - name: termCode
        in: path
        description: Waterloo Term code to filter on
        required: true
        schema:
          maxLength: 4
          minLength: 4
          type: string
      - name: subject
        in: path
        description: Academic Subject code to filter ron
        required: true
        schema:
          pattern: ^[A-Za-z]*$
          type: string
      - name: catalogNumber
        in: path
        description: Catalog number to filter on
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Class'
      operationId: getV3ClassSchedulesByTermCodeBySubjectByCatalogNumber
      x-operation-id-source: derived
components:
  schemas:
    ClassSchedule:
      type: object
      properties:
        courseId:
          type:
          - string
          - 'null'
          description: Course identifier number, not unique
        courseOfferNumber:
          type: integer
          description: Course offer number identifier for this class
          format: int32
        sessionCode:
          type:
          - string
          - 'null'
          description: Session code number for this class
        classSection:
          type: integer
          description: Number identifying the section of this class
          format: int32
        termCode:
          type:
          - string
          - 'null'
          description: Waterloo academic term code
        classMeetingNumber:
          type: integer
          description: Identifier for the class meeting this schedule data relates to
          format: int32
        scheduleStartDate:
          type: string
          description: The date this schedule begins
          format: date-time
        scheduleEndDate:
          type: string
          description: The date this schedule ends
          format: date-time
        classMeetingStartTime:
          type:
          - string
          - 'null'
          description: The start time of this class
          format: date-time
        classMeetingEndTime:
          type:
          - string
          - 'null'
          description: The end time of this class
          format: date-time
        classMeetingDayPatternCode:
          type:
          - string
          - 'null'
          description: A code representing the days the class schedule takes place during the week
        classMeetingWeekPatternCode:
          type:
          - string
          - 'null'
          description: A Y|N per day representation of the class schedule taking place during the week
        locationName:
          type:
          - string
          - 'null'
          description: REMOVED for privacy. Building and room name for the location of this class schedule
      additionalProperties: false
      description: Data describing scheduling and availability data for a Class
    ClassInstructor:
      type: object
      properties:
        courseId:
          type:
          - string
          - 'null'
          description: Course identifier number, not unique
        courseOfferNumber:
          type: integer
          description: Course offer number identifier for this class
          format: int32
        sessionCode:
          type:
          - string
          - 'null'
          description: Session code number for this class
        classSection:
          type: integer
          description: Number identifying the section of this class
          format: int32
        termCode:
          type:
          - string
          - 'null'
          description: Waterloo academic term code
        instructorRoleCode:
          type:
          - string
          - 'null'
          description: REMOVED for privacy. The code designation for the instructor's role in this class
        instructorFirstName:
          type:
          - string
          - 'null'
          description: REMOVED for privacy. The Instructors preferred first name
        instructorLastName:
          type:
          - string
          - 'null'
          description: REMOVED for privacy. The Instructors preferred last name
        instructorUniqueIdentifier:
          type:
          - string
          - 'null'
          description: REMOVED for privacy. A unique identifier that persists through name changes. Not guaranteed, but likely to be immutable for instructor.
        classMeetingNumber:
          type: integer
          description: Identifier for the class meeting this instructor is for
          format: int32
      additionalProperties: false
      description: A person instructing a Class
    Class:
      type: object
      properties:
        courseId:
          type:
          - string
          - 'null'
          description: Course identifier number, not unique
        courseOfferNumber:
          type: integer
          description: Course offer number identifier for this class
          format: int32
        sessionCode:
          type:
          - string
          - 'null'
          description: Session code for this class
        classSection:
          type: integer
          description: Number identifying the section of this class
          format: int32
        termCode:
          type:
          - string
          - 'null'
          description: Waterloo academic term code
        classNumber:
          type: integer
          description: Class number identifier for this class
          format: int32
        courseComponent:
          type:
          - string
          - 'null'
          description: Course component code for this class
        associatedClassCode:
          type: integer
          description: Associated class code for this class
          format: int32
        maxEnrollmentCapacity:
          type: integer
          description: Indicates the maximum number of students that can enroll in this class
          format: int32
        enrolledStudents:
          type: integer
          description: Indicates the current number of students enrolled in this class
          format: int32
        enrollConsentCode:
          type:
          - string
          - 'null'
          description: Code describing whether No, Instructor, or Department consent to enroll is required. Overrides Course level information if different.
        enrollConsentDescription:
          type:
          - string
          - 'null'
          description: Description of the enroll requirement. Overrides Course level information if different.
          readOnly: true
        dropConsentCode:
          type:
          - string
          - 'null'
          description: Code describing whether No, Instructor, or Department consent to drop is required. Overrides Course level information if different.
        dropConsentDescription:
          type:
          - string
          - 'null'
          description: Description of the drop requirement. Overrides Course level information if different.
          readOnly: true
        scheduleData:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ClassSchedule'
          description: Schedule data for this class
        instructorData:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ClassInstructor'
          description: Instructor data for this class
      additionalProperties: false
      description: Represents an Academic class, which is a scheduled instance of a Course
  securitySchemes:
    apiKey:
      type: apiKey
      description: Custom API key authentication
      name: x-api-key
      in: header
