openapi: 3.2.0
info:
  title: Waterloo OpenData Subjects API
  version: v3
servers:
- url: https://openapi.data.uwaterloo.ca
  description: University of Waterloo OpenData API v3
security:
- apiKey: []
tags:
- name: Subjects
paths:
  /v3/Subjects:
    get:
      tags:
      - Subjects
      summary: Gets all Subject data
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
      operationId: getV3Subjects
      x-operation-id-source: derived
  /v3/Subjects/{code}:
    get:
      tags:
      - Subjects
      summary: Gets Subject data filtered by Subject code
      parameters:
      - name: code
        in: path
        description: Specific Subject code
        required: true
        schema:
          pattern: ^[A-Za-z]*$
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subject'
      operationId: getV3SubjectsByCode
      x-operation-id-source: derived
  /v3/Subjects/associatedto/{organizationCode}:
    get:
      tags:
      - Subjects
      summary: Gets Subject data for Subjects associated to an Academic Organization by…
      parameters:
      - name: organizationCode
        in: path
        description: Academic Organization Code that associates to the Subjects
        required: true
        schema:
          pattern: ^[A-Za-z]*$
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subject'
      operationId: getV3SubjectsAssociatedtoByOrganizationCode
      x-operation-id-source: derived
components:
  schemas:
    Subject:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Code that identifies this Subject
        name:
          type:
          - string
          - 'null'
          description: The Name for this Subject, most often the displayed name
        descriptionAbbreviated:
          type:
          - string
          - 'null'
          description: The short description of this subject, often same as Code
        description:
          type:
          - string
          - 'null'
          description: Description of the Subject
        associatedAcademicOrgCode:
          type:
          - string
          - 'null'
          description: Code for the Academic Organization that is associated to this Subject
      additionalProperties: false
      description: An academic Subject at Waterloo describes an area that a Course can be in
  securitySchemes:
    apiKey:
      type: apiKey
      description: Custom API key authentication
      name: x-api-key
      in: header
