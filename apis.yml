---
aid: university-of-waterloo
name: University of Waterloo
description: >-
  The University of Waterloo is a public research university in Waterloo, Ontario, Canada, known for
  cooperative education and for strength in mathematics, engineering and computer science. Unusually
  for this cohort, Waterloo genuinely operates its own API programme rather than appearing programmable
  through a vendor's contract: the Open Data API v3 at openapi.data.uwaterloo.ca is Waterloo-built and
  Waterloo-hosted, publishes a first-party OpenAPI at /swagger/v1/swagger.json, exposes 48 self-serve
  key-authenticated operations across courses, class and exam schedules, terms, subjects, academic organizations,
  locations, food services, important dates and web content, and carries a dated release-note stream,
  a published 120 requests-per-minute cap and a completed v2 retirement. Alongside it Waterloo runs
  a second, deliberately gated SourceAPI over authoritative Quest and WatIAM data, its own Shibboleth
  identity provider at idp.uwaterloo.ca, and the UWSpace institutional repository with DSpace REST and
  OAI-PMH endpoints on a Waterloo Libraries host. What it does not run is the research-data platform:
  Waterloo's data collection is a tenancy on the consortial Borealis Dataverse, and its status page
  is a Statuspage tenancy — both recorded here as relationships, not as Waterloo engineering. There
  is no unified developer portal spanning the three programmes; documentation is split between a Confluence
  space, a GitHub wiki and a Swagger UI.
x-type: university
x-category: Public Research University
