  - aid: university-of-waterloo:university-of-waterloo-sourceapi
    name: University of Waterloo SourceAPI
    description: >-
      A second, deliberately gated University of Waterloo API programme providing authenticated access
      to data from authoritative source systems including Quest (student information) and WatIAM (identity
      and access management). Access is requested through Jira Service Desk portal 115 and granted per
      data set in collaboration with the responsible data stewards, under University of Waterloo Policy
      46 - Information Management. Waterloo publishes terms of service, an acceptable use policy, getting-started
      material and release notes for it, but no machine-readable contract and no public host — so it
      is recorded as an institution-operated surface with no artifact set, not padded out with a fabricated
      one.
    humanURL: https://uwaterloo.atlassian.net/wiki/spaces/UWAPI/pages/34019779677/SourceAPI+Home+Page
    x-operator: institution
    x-operator-basis: >-
