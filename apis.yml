    name: University of Waterloo Dataverse Collection (Borealis)
    description: >-
      Waterloo's named research-data collection on Borealis, the Canadian consortial Dataverse repository
      operated by Scholars Portal for the Ontario Council of University Libraries. The collection is
      Waterloo's — Waterloo's researchers, Waterloo Library's Research Data Management team reviewing
      deposits, Waterloo's deposit guidelines — but the platform, the API contract and the DataCite
      client (OCUL.SPDV) are the consortium's. Recorded here as a tenancy: the relationship is a real
      institutional fact, the Dataverse contract is not Waterloo's engineering and is not saved under
      this slug.
