x-coverage:
  state: covered
  reason: covered
  detail: >-
    Every layer of Waterloo's programmable footprint was reached unauthenticated. The live first-party
    OpenAPI was located behind the Swagger UI at /swagger/v1/swagger.json (48 operations, 12 tags, apiKey
    scheme) and matches the pristine copy in openapi/_original/. Live unauthenticated calls to /v3/Terms,
    /v3/Subjects and /v3/Locations returned the real 401 error envelope, which the contract does not
    document. The Confluence UWAPI space was read through the Confluence content API, yielding the SourceAPI
    programme, its terms of service and acceptable use policy, the roadmap, the dataset inventory and
    a dated release-note stream back to 2017 including the published 120 req/min cap. Waterloo's own
    Shibboleth IdP metadata, the UWSpace DSpace 8.4 REST root and its OAI-PMH Identify response all
    returned 200 on Waterloo hosts. Crossref member 6095 and ROR 01aff2v68 were confirmed against the
    registries. Two vendor tenancies were recorded rather than credited as Waterloo contracts: the Borealis
    Dataverse collection and the Statuspage status API. The one dead pointer found — the Waterloo News
    RSS feed, which now returns a deliberate 403 Access denied page — was removed and replaced with
    the live news index.
