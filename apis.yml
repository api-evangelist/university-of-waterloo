  - aid: university-of-waterloo:uwspace-dspace-rest-api
    name: UWSpace DSpace REST API
    description: >-
      The REST backend of UWSpace, the University of Waterloo institutional repository, running DSpace
      8.4 on a University of Waterloo Libraries host. The root document at /server/api returns a HAL
      index of the full DSpace resource graph — communities, collections, items, bitstreams, discovery,
      submission and authn. Waterloo operates the deployment; the contract is DSpace's open-source API,
      shared by every DSpace installation, so no generic DSpace spec is saved under Waterloo's slug.
      The deployment is the institutional fact, and it is recorded here.
    humanURL: https://uwspace.uwaterloo.ca/
    baseURL: https://dspacemainprd01.lib.uwaterloo.ca/server/api
    x-operator: institution
    x-operator-basis: >-
      Host dspacemainprd01.lib.uwaterloo.ca is under the University of Waterloo registrable domain and
      is self-hosted by Waterloo Libraries; the root document names dspaceUI https://uwspace.uwaterloo.ca
      and dspaceName UWSpace. The software underneath is DSpace 8.4 — a shared open-source contract,
      which is why no spec is saved.
    x-contract-owner: DSpace (LYRASIS) — open-source, shared by every DSpace deployment
    tags:
      - Research Repository
      - Institutional Repository
      - Open Access
    properties:
      - type: Website
        url: https://uwspace.uwaterloo.ca/
      - type: APIReference
        url: https://dspacemainprd01.lib.uwaterloo.ca/server/api
      - type: Documentation
        url: https://github.com/DSpace/RestContract
  - aid: university-of-waterloo:uwspace-oai-pmh
    name: UWSpace OAI-PMH Endpoint
    description: >-
      The OAI-PMH 2.0 metadata harvesting endpoint for UWSpace, the University of Waterloo institutional
      repository. A verb=Identify request returns protocolVersion 2.0, repositoryName UWSpace, an adminEmail
      of uwspace-admin@uwaterloo.ca and an earliest datestamp of 2006-07-28, confirming Waterloo has
      been exposing harvestable repository metadata for close to twenty years. This is an institution-operated
      surface and a direct hit against the education regime standard oai-pmh.
    humanURL: https://uwspace.uwaterloo.ca/
    baseURL: https://dspacemainprd01.lib.uwaterloo.ca/server/oai/request
    x-operator: institution
