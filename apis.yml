  - aid: university-of-waterloo:university-of-waterloo-shibboleth-idp
    name: University of Waterloo Shibboleth Identity Provider
    description: >-
      The University of Waterloo's own SAML 2.0 identity provider metadata, served as XML from idp.uwaterloo.ca.
      The EntityDescriptor carries entityID https://idp.uwaterloo.ca/idp/shibboleth, a shibboleth Scope
      of uwaterloo.ca, a display name and organization name of University of Waterloo, and protocol
      support for SAML 2.0, SAML 1.1 and Shibboleth 1.0. Waterloo participates in the Canadian Access
      Federation, which is shared by definition — the identity provider behind it is not. This is one
      of the strongest institution-operated machine-readable surfaces a university has and it is routinely
      uncatalogued.
    humanURL: https://uwaterloo.ca/information-systems-technology/
    baseURL: https://idp.uwaterloo.ca/idp/shibboleth
